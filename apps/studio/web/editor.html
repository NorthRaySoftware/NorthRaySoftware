<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src https://objects.nrstudio.localhost; font-src 'self'; connect-src 'self'">
<title>Manuscript</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
<div id="bar" role="toolbar" aria-label="Formatting">
  <select id="style" aria-label="Paragraph style" title="Paragraph style"></select>
  <span class="sep"></span>
  <button id="b" title="Bold (Ctrl+B)" aria-label="Bold"><b>B</b></button>
  <button id="i" title="Italic (Ctrl+I)" aria-label="Italic"><i>I</i></button>
  <button id="u" title="Underline (Ctrl+U)" aria-label="Underline"><u>U</u></button>
  <button id="sc" title="Small capitals (Ctrl+Shift+K)" aria-label="Small capitals" class="sc-btn">Sc</button>
  <span class="sep"></span>
  <button id="break" title="Scene break (Ctrl+Enter)" aria-label="Scene break">&#x2042;</button>
  <button id="quote" title="Block quote" aria-label="Block quote">&#x201C;</button>
  <button id="ul" title="Bulleted list" aria-label="Bulleted list">&#x2022;</button>
  <button id="ol" title="Numbered list" aria-label="Numbered list">1.</button>
  <button id="img" title="Insert a picture" aria-label="Insert a picture">&#x25A3;</button>
  <button id="comment" title="Comment on the selected words (Ctrl+Alt+M)" aria-label="Comment">&#x270E;</button>
  <button id="thes" title="Other words and phrases for the selection or the word at the cursor (Ctrl+Shift+O)" aria-label="Other words">&#x2248;</button>
  <span class="sep"></span>
  <button id="undo" title="Undo (Ctrl+Z)" aria-label="Undo">&#x21B6;</button>
  <button id="redo" title="Redo (Ctrl+Y)" aria-label="Redo">&#x21B7;</button>
  <span class="sep"></span>
  <button id="viewbtn" title="Writing view: font, page width, focus, typewriter, hints" aria-label="Writing view" aria-haspopup="true" aria-expanded="false">Aa</button>
  <span class="grow"></span>
  <span id="notice" aria-live="polite" hidden></span>
  <button id="hints" title="Style hints: what's marked in this chapter, and your own rules" aria-haspopup="true"></button>
  <button id="prev" title="Previous chapter (Ctrl+Up)" aria-label="Previous chapter">&#x2039;</button>
  <button id="next" title="Next chapter (Ctrl+Down)" aria-label="Next chapter">&#x203A;</button>
  <span class="sep"></span>
  <span id="count" aria-live="polite"></span>
  <span id="saved" aria-live="polite"></span>
</div>
<div id="viewmenu" role="dialog" aria-label="Writing view" hidden>
  <div class="vm-label">Font</div>
  <div class="vm-row">
    <button data-set="font" data-value="serif" class="f-serif">Serif</button>
    <button data-set="font" data-value="book" class="f-book">Book</button>
    <button data-set="font" data-value="sans" class="f-sans">Sans</button>
    <button data-set="font" data-value="typewriter" class="f-typewriter">Typewriter</button>
  </div>
  <div class="vm-label">Size</div>
  <div class="vm-row">
    <button data-set="size" data-value="0" title="Small">A<span class="vm-s0"></span></button>
    <button data-set="size" data-value="1" title="Medium" class="vm-s1">A</button>
    <button data-set="size" data-value="2" title="Large" class="vm-s2">A</button>
    <button data-set="size" data-value="3" title="Extra large" class="vm-s3">A</button>
  </div>
  <div class="vm-label">Page width</div>
  <div class="vm-row">
    <button data-set="width" data-value="narrow">Narrow</button>
    <button data-set="width" data-value="normal">Normal</button>
    <button data-set="width" data-value="wide">Wide</button>
  </div>
  <div class="vm-rule"></div>
  <label class="vm-check"><input type="checkbox" name="focus"> Focus mode <span class="vm-key">Ctrl+Shift+F</span>
    <span class="vm-note">Hides the side panels and fades everything but the paragraph you're in.</span></label>
  <label class="vm-check"><input type="checkbox" name="typewriter"> Typewriter scrolling <span class="vm-key">Ctrl+Shift+T</span>
    <span class="vm-note">Keeps the line you're typing in the middle of the window.</span></label>
  <label class="vm-check"><input type="checkbox" name="spellcheck"> Check spelling
    <span class="vm-note">Uses Windows' own spelling dictionaries. Right-click a word for suggestions.</span></label>
  <div class="vm-label">Style hints</div>
  <div class="vm-row">
    <button data-set="hints" data-value="off">Off</button>
    <button data-set="hints" data-value="quiet">Quiet</button>
    <button data-set="hints" data-value="full">Full</button>
  </div>
  <div class="vm-note vm-pad">Gentle underlines; hover one for why. Click the hint count in the toolbar to choose which kinds, and to make your own rules.</div>
  <label class="vm-check"><input type="checkbox" name="names"> Link names to the bible
    <span class="vm-note">Names from Worldbuilding are underlined; Ctrl+click one to open its page.</span></label>
</div>
<div id="hintlist" role="dialog" aria-label="Style hints" hidden></div>
<div id="hintcard" role="tooltip" hidden></div>
<div id="namecard" role="tooltip" hidden></div>
<div id="rules" role="dialog" aria-label="Style rules" hidden></div>
<div id="scroller">
  <article>
    <h1 id="title"></h1>
    <div id="page"></div>
  </article>
</div>
<script src="editor.js"></script>
</body>
</html>
