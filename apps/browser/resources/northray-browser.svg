<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">NorthRay Browser</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1426"/>
      <stop offset="1" stop-color="#14233A"/>
    </linearGradient>
    <linearGradient id="a1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7CF5B0"/>
      <stop offset="0.6" stop-color="#2FC6A0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#2FC6A0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="a2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5FE0D0" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#3A8FD8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3A8FD8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="a3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#B58BF0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7A5BD6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="globe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B3A5C"/>
      <stop offset="1" stop-color="#0A1424"/>
    </linearGradient>
    <clipPath id="tile"><rect x="8" y="8" width="240" height="240" rx="52"/></clipPath>
    <clipPath id="globeClip"><circle cx="128" cy="300" r="150"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="url(#sky)"/>
    <!-- aurora curtains over the horizon -->
    <path d="M-10 142 C 36 112, 70 150, 118 124 S 196 92, 266 112 L 266 20 C 196 4, 140 40, 90 26 S 14 12, -10 30 Z" fill="url(#a3)"/>
    <path d="M-10 164 C 40 134, 80 172, 132 146 S 208 118, 266 138 L 266 52 C 200 34, 148 72, 96 58 S 18 44, -10 62 Z" fill="url(#a2)"/>
    <path d="M-10 182 C 44 158, 88 192, 140 168 S 214 142, 266 160 L 266 88 C 206 70, 156 104, 104 92 S 20 78, -10 96 Z" fill="url(#a1)"/>
    <!-- stars -->
    <g fill="#E8EDF7">
      <circle cx="44" cy="40" r="1.6" opacity="0.8"/><circle cx="70" cy="66" r="1.1" opacity="0.6"/>
      <circle cx="150" cy="34" r="1.3" opacity="0.7"/><circle cx="214" cy="80" r="1.2" opacity="0.6"/>
      <circle cx="30" cy="104" r="1" opacity="0.5"/>
    </g>
    <!-- the north star -->
    <path d="M186 30 L190 50 L210 54 L190 58 L186 78 L182 58 L162 54 L182 50 Z" fill="#F4F7FF"/>
    <!-- a rising globe: the web, seen from the north -->
    <circle cx="128" cy="300" r="150" fill="url(#globe)"/>
    <g clip-path="url(#globeClip)" fill="none" stroke="#7CF5B0" stroke-opacity="0.55" stroke-width="4">
      <ellipse cx="128" cy="300" rx="150" ry="150"/>
      <ellipse cx="128" cy="300" rx="96" ry="150"/>
      <ellipse cx="128" cy="300" rx="40" ry="150"/>
      <path d="M-30 196 C 40 176, 216 176, 286 196"/>
      <path d="M-30 228 C 40 210, 216 210, 286 228"/>
    </g>
    <circle cx="128" cy="300" r="150" fill="none" stroke="#9EF7C8" stroke-width="5"/>
  </g>
</svg>
